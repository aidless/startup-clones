[project]
name = "auditloop"
version = "0.1.0"
description = "给中小会计师事务所的审计底稿自动化：银行调节、账龄、收入截止，例外清单 + Excel 底稿"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auditloop = "auditloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auditloop*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
