[project]
name = "georadar"
version = "0.1.0"
description = "AI 搜索引擎可见性监测：品牌在 ChatGPT / Perplexity / Gemini 回答里的份额、位次与引用源"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
georadar = "georadar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["georadar*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
