# agentstore 的 CI：跑测试 + 真跑一遍 quickstart。
#
# 这份工作流按"agentstore 是仓库根"写的（独立开源包视角）：checkout 下来就是包本身，
# 所以路径里没有 agent-store/ 前缀。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（含 dev extra）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 单元测试
        run: python -m pytest -q

      - name: quickstart 冒烟（真生成工作区，再真跑里面的脚本）
        run: |
          python -m agentstore.cli quickstart
          test -f agentstore-quickstart/agents/hello/agent.json
          test -f agentstore-quickstart/run.py
          cd agentstore-quickstart
          python run.py
          python -m agentstore.cli demo
          # 重跑不覆盖用户改动：这里断言第二次执行仍然成功且打印 skip
          cd ..
          python -m agentstore.cli quickstart | tee /tmp/qs2.log
          grep -q "skip" /tmp/qs2.log
