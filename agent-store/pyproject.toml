[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstore"
version = "0.1.0"
description = "agent 应用商店的最小内核：清单、不可变版本、权限闸、计量与分成"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
keywords = ["agent", "marketplace", "metering", "idempotency", "billing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/aidless/agentstore"
Source = "https://github.com/aidless/agentstore"
Issues = "https://github.com/aidless/agentstore/issues"

[project.scripts]
agentstore = "agentstore.cli:main"

[tool.setuptools.packages.find]
include = ["agentstore*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
