[pytest]
# 一次跑完七个项目的全部测试：python3 -m pytest -q（在 startup-clones/ 下）
# 各子项目仍有自己的 pyproject 配置，单独进目录跑完全不受影响。
testpaths = geo-radar filing-lens audit-loop cruxline agent-inbox agent-store console go-to-market
pythonpath =
    geo-radar
    filing-lens
    audit-loop
    cruxline
    agent-inbox
    agent-store
    console
    go-to-market
addopts = --import-mode=importlib -q
