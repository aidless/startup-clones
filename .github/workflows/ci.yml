name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依赖
        run: |
          python -m pip install -U pip
          pip install pytest fastapi "uvicorn[standard]" openpyxl httpx
      - name: 单元/集成测试（根目录一次跑完七个项目）
        run: python -m pytest
      - name: 端到端串联（真跑子进程）
        run: python scripts/e2e.py
      - name: 全语料解析矩阵（22 份 10-K，与基线对比）
        run: python scripts/corpus_matrix.py --baseline docs/corpus-matrix.json
      - name: 打磨判据（README/边界/CLI/卫生）
        run: python scripts/polish_audit.py
