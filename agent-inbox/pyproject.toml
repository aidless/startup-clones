[project]
name = "agentinbox"
version = "0.1.0"
description = "常驻 agent 的消息层：多渠道归一化、白名单/限流/审批、记忆与上下文预算"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentinbox = "agentinbox.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentinbox*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
